name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JOLT_VERSION: '0.8.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libssl3
          # Use the tagged installer so this 0.8-only FFI surface cannot silently
          # be tested against the older release currently selected by main.
          curl -fsSL "https://raw.githubusercontent.com/jolt-lang/jolt/v${JOLT_VERSION}/install" \
            | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Verify Jolt version
        run: test "$(jolt --version)" = "jolt v${JOLT_VERSION}"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
